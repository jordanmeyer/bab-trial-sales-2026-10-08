<!doctype html><meta charset="utf-8"><title>Original app layout review</title><label>Frame width<select id="width"><option>1280</option><option>390</option><option>320</option></select></label><label>Text size<select id="text"><option value="100">100%</option><option value="200">200%</option></select></label><button id="apply">Apply</button><button id="measure">Measure</button><iframe title="Application" src="../app/" style="display:block;width:1280px;height:844px;border:1px solid"></iframe><pre id="report"></pre><script>
const frame=document.querySelector('iframe');document.querySelector('#apply').onclick=()=>{const width=Number(document.querySelector('#width').value);frame.style.width=width+'px';const factor=Number(document.querySelector('#text').value)/100;for(const el of frame.contentDocument.querySelectorAll('*')){el.dataset.originalFont ||= frame.contentWindow.getComputedStyle(el).fontSize;}for(const el of frame.contentDocument.querySelectorAll('*'))el.style.fontSize=(parseFloat(el.dataset.originalFont)*factor)+'px';};document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument;document.querySelector('#report').textContent=JSON.stringify({width:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,labels:[...d.querySelectorAll('h1,h2')].map(e=>e.textContent),visibleRows:d.querySelectorAll('#rows tr,#ledger tr').length,focused:d.activeElement.outerHTML.slice(0,250)},null,2);};</script>
